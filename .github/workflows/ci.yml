name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # nightly: flaky timing, and drift in libraries tracked at main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      # Builds hashes_compare, and runs its check of xxh64 against XXH64 (xxHash is fetched).
      cmake_args: -DHASHES_BUILD_BENCH=ON
