name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      # Builds hashes_compare, and runs its check of xxh64 against XXH64 (xxHash is fetched).
      cmake_args: -DHASHES_BUILD_BENCH=ON
